<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Page d'accueil du dépôt codex-prime.">
  <title>Codex Prime</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top left, rgba(94, 234, 212, .16), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(129, 140, 248, .18), transparent 34rem),
        #0b1020;
    }

    main {
      width: min(760px, 100%);
      padding: clamp(2rem, 5vw, 4rem);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(17, 24, 39, .78);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 .75rem;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #5eead4;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 9vw, 6rem);
      line-height: .95;
      letter-spacing: -.055em;
    }

    p {
      max-width: 58ch;
      margin: 1.5rem 0 0;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
      color: #cbd5e1;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-top: 2rem;
      padding: .7rem 1rem;
      border-radius: 999px;
      background: rgba(94, 234, 212, .1);
      border: 1px solid rgba(94, 234, 212, .25);
      color: #ccfbf1;
      font-size: .95rem;
    }

    .dot {
      width: .6rem;
      height: .6rem;
      border-radius: 999px;
      background: #5eead4;
      box-shadow: 0 0 18px #5eead4;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GitHub Pages</p>
    <h1>Codex Prime</h1>
    <p>
      Le dépôt est initialisé et cette page constitue une base légère, responsive et sans dépendance pour commencer le projet.
    </p>
    <div class="status"><span class="dot" aria-hidden="true"></span>Prêt à publier</div>
  </main>
</body>
</html>
